<text x="428" y="712" font-size="7.4" class="bold muted">NO</text>
<rect x="170" y="55.88980000000004" width="255" height="42" rx="8" fill="#1D4ED8" stroke="#1D4ED8" stroke-width="1.1"/>
<text x="297.5" y="70.09" font-size="9.0" text-anchor="middle" class="bold">START</text>
<text x="297.5" y="80.09" font-size="7.8" text-anchor="middle" class="">User goal, task, deadline, priority,</text>
<text x="297.5" y="90.09" font-size="7.8" text-anchor="middle" class="">availability, or project requirement</text>
<rect x="170" y="115.88980000000004" width="255" height="48" rx="8" fill="#E8F0FF" stroke="#1D4ED8" stroke-width="1.1"/>
<text x="297.5" y="137.69" font-size="9.0" text-anchor="middle" class="bold">1. Extract goals and facts</text>
<text x="297.5" y="147.69" font-size="7.8" text-anchor="middle" class="">Separate known information from missing details.</text>
<rect x="170" y="181.88980000000004" width="255" height="54" rx="8" fill="#FFF1E8" stroke="#A04000" stroke-width="1.1"/>
<text x="297.5" y="202.09" font-size="9.0" text-anchor="middle" class="bold">Required information complete?</text>
<text x="297.5" y="212.09" font-size="7.8" text-anchor="middle" class="">Check duration, deadline, availability,</text>
<text x="297.5" y="222.09" font-size="7.8" text-anchor="middle" class="">and dependencies.</text>
<rect x="22" y="183.88980000000004" width="125" height="66" rx="8" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.1"/>
<text x="84.5" y="210.09" font-size="9.0" text-anchor="middle" class="bold">CLARIFY</text>
<text x="84.5" y="220.09" font-size="7.8" text-anchor="middle" class="">Ask a focused question.</text>
<text x="84.5" y="230.09" font-size="7.8" text-anchor="middle" class="">Do not invent missing information.</text>
<rect x="170" y="259.88980000000004" width="255" height="46" rx="8" fill="#E8F0FF" stroke="#1D4ED8" stroke-width="1.1"/>
<text x="297.5" y="280.69" font-size="9.0" text-anchor="middle" class="bold">2. Create or update tasks</text>
<text x="297.5" y="290.69" font-size="7.8" text-anchor="middle" class="">Break the goal into manageable work items.</text>
<rect x="170" y="327.88980000000004" width="255" height="46" rx="8" fill="#E8F0FF" stroke="#1D4ED8" stroke-width="1.1"/>
<text x="297.5" y="348.69" font-size="9.0" text-anchor="middle" class="bold">3. Set priority and dependencies</text>
<text x="297.5" y="358.69" font-size="7.8" text-anchor="middle" class="">Use urgency, importance, deadlines, and prerequisites.</text>
<rect x="170" y="393.88980000000004" width="255" height="50" rx="8" fill="#E8F0FF" stroke="#1D4ED8" stroke-width="1.1"/>
<text x="297.5" y="412.09" font-size="9.0" text-anchor="middle" class="bold">4. Check constraints</text>
<text x="297.5" y="422.09" font-size="7.8" text-anchor="middle" class="">Compare duration, availability, deadlines,</text>
<text x="297.5" y="432.09" font-size="7.8" text-anchor="middle" class="">and dependencies.</text>
<rect x="170" y="461.88980000000004" width="255" height="54" rx="8" fill="#FFF1E8" stroke="#A04000" stroke-width="1.1"/>
<text x="297.5" y="486.69" font-size="9.0" text-anchor="middle" class="bold">Plan feasible?</text>
<text x="297.5" y="496.69" font-size="7.8" text-anchor="middle" class="">Can the requested work fit the known constraints?</text>
<rect x="22" y="461.88980000000004" width="125" height="80" rx="8" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.1"/>
<text x="84.5" y="490.49" font-size="9.0" text-anchor="middle" class="bold">REVISE</text>
<text x="84.5" y="500.49" font-size="7.8" text-anchor="middle" class="">Explain conflicts and list</text>
<text x="84.5" y="510.49" font-size="7.8" text-anchor="middle" class="">unscheduled tasks.</text>
<text x="84.5" y="520.49" font-size="7.8" text-anchor="middle" class="">User changes tasks or constraints.</text>
<rect x="170" y="539.8898" width="255" height="46" rx="8" fill="#E8F0FF" stroke="#1D4ED8" stroke-width="1.1"/>
<text x="297.5" y="560.69" font-size="9.0" text-anchor="middle" class="bold">5. Build a proposed schedule</text>
<text x="297.5" y="570.69" font-size="7.8" text-anchor="middle" class="">Place tasks in available time; keep assumptions visible.</text>
<rect x="170" y="605.8898" width="255" height="50" rx="8" fill="#F5F7FA" stroke="#1D4ED8" stroke-width="1.1"/>
<text x="297.5" y="628.69" font-size="9.0" text-anchor="middle" class="bold">6. Present the result</text>
<text x="297.5" y="638.69" font-size="7.8" text-anchor="middle" class="">Show schedule, warnings, assumptions, and pending work.</text>
<rect x="170" y="675.8898" width="255" height="54" rx="8" fill="#FFF1E8" stroke="#A04000" stroke-width="1.1"/>
<text x="297.5" y="700.69" font-size="9.0" text-anchor="middle" class="bold">User changes something?</text>
<text x="297.5" y="710.69" font-size="7.8" text-anchor="middle" class="">Deadline, priority, task status, or requirement changed?</text>
<rect x="448" y="673.8898" width="125" height="70" rx="8" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.1"/>
<text x="510.5" y="702.09" font-size="9.0" text-anchor="middle" class="bold">UPDATE</text>
<text x="510.5" y="712.09" font-size="7.8" text-anchor="middle" class="">Apply the change and</text>
<text x="510.5" y="722.09" font-size="7.8" text-anchor="middle" class="">recalculate the plan.</text>
<rect x="170" y="755.8898" width="255" height="52" rx="8" fill="#F5F7FA" stroke="#1D4ED8" stroke-width="1.1"/>
<text x="297.5" y="779.69" font-size="9.0" text-anchor="middle" class="bold">7. Track progress and next action</text>
<text x="297.5" y="789.69" font-size="7.8" text-anchor="middle" class="">Mark work state; revise the proposal when the situation changes.</text>
<text x="34" y="832" font-size="7.4" class="muted">A proposed schedule is reviewed and revised when the user's situation changes.</text>
<text x="450" y="832" font-size="7.4" class="bold muted">Team 02</text>
</svg>